aid: ethereum
name: Ethereum
description: >-
  Ethereum is a decentralized, open-source blockchain platform that supports smart contracts - self-executing programs
  that run on its distributed network. It is the foundation for a vast ecosystem of decentralized applications (dApps),
  tokens, DeFi protocols, and NFTs, and uses a proof-of-stake consensus mechanism.
